# Experimental A5: A4 execution budgets and margins with a 535-byte TLS reserve
# (rcutils error state shared: 2,576 -> 532 TLS bytes). Each stack is
# Round16(TLS reserve 535 + 99 arch/alignment/sentinel + execution + 256 margin).
# Idle needs 512 extra bytes after the hardware startup measurement.
# Execution budgets otherwise match A4: main 8704, idle 1024, workqueue/timer
# 3072, network 1408, Cyclone worker 8192.
CONFIG_MAIN_STACK_SIZE=9600
# The 1408-byte trial left only 76 unused bytes after DDS startup.
CONFIG_IDLE_STACK_SIZE=1920
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3968
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=3968
CONFIG_NET_RX_STACK_SIZE=2304
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2304
CONFIG_ROS2_ZEPHYR_CYCLONEDDS_THREAD_STACK_SIZE=9088
CONFIG_STACK_SENTINEL=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=119808
CONFIG_MAX_PTHREAD_MUTEX_COUNT=5
CONFIG_MAX_PTHREAD_COND_COUNT=5
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=5
CONFIG_ROS2_ZEPHYR_CYCLONEDDS_THREAD_COUNT=5
# DDS uses UDP only: removes the TCP workqueue thread and connection slab.
CONFIG_NET_TCP=n
# Synchronous minimal logging: removes the logging thread and deferred buffer.
CONFIG_LOG_MODE_MINIMAL=y
