# The supported ESP32-S3 module has octal flash. Auto-detection switches modes
# after boot, which is too late when the ROM left the flash in OPI mode. Use
# STR because DTR calibration does not complete on the 32 MiB MXIC part.
CONFIG_ESPTOOLPY_OCT_FLASH=y
CONFIG_ESPTOOLPY_FLASH_SAMPLE_MODE_STR=y

# Move large plain-data ROS and Cyclone DDS allocations out of scarce internal
# DRAM. The qualified ESP32-S3 module has 16 MiB of octal PSRAM; expose a
# deliberately bounded portion through Zephyr's shared external-memory heap.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=1048576
